<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; img-src 'self' http://127.0.0.1:* http://localhost:* blob: data:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlideAnnotate — 教学批注</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>SlideAnnotate</h1>
      <p class="sub">本地处理 PDF / PPTX：原页不改，导出 PDF 批注或 PPT 演讲者备注</p>
    </div>
    <span id="svcStatus" class="badge">服务检测中…</span>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>1. 文件与密钥</h2>
      <label class="field">
        <span>选择文件（.pdf / .pptx）</span>
        <input type="file" id="fileInput" accept=".pdf,.pptx" />
      </label>
      <label class="field">
        <span>DeepSeek API Key（仅存本机浏览器存储）</span>
        <input type="password" id="apiKey" autocomplete="off" placeholder="sk-..." />
      </label>
      <label class="field check-row">
        <input type="checkbox" id="autoGenAfterUpload" checked />
        <span>上传解析后自动用 DeepSeek 按页生成中文教学批注（需已填 Key）</span>
      </label>
      <div class="row">
        <button type="button" id="btnUpload" class="primary" disabled>上传并解析页面</button>
        <button type="button" id="btnGenerateAll" class="primary" disabled>一键生成全部批注</button>
      </div>
      <p id="jobInfo" class="muted"></p>
    </section>

    <section class="panel grow">
      <div class="toolbar">
        <h2>2. 预览与编辑</h2>
        <div class="row">
          <button type="button" id="btnExport" disabled>导出带批注文件</button>
          <span id="pageHint" class="muted"></span>
        </div>
      </div>
      <div class="carousel-bar row" id="carouselBar" hidden>
        <button type="button" id="btnPrevPage">上一页</button>
        <span id="carouselIndicator" class="carousel-indicator"></span>
        <button type="button" id="btnNextPage">下一页</button>
      </div>
      <div id="pageList" class="page-list"></div>
    </section>
  </main>

  <footer class="footer muted">
    导出说明：PDF 在每页原文后追加一页「教学批注」专页（普通页面，非悬停注释）；PPTX 写入演讲者备注。
  </footer>

  <script src="./app.js"></script>
</body>
</html>
